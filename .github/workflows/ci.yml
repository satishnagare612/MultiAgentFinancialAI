name: Financial AI CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  dotnet-build-and-test:
    name: Build & Test .NET 8 Solutions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore FinancialAI.sln

      - name: Build Solution
        run: dotnet build FinancialAI.sln --no-restore -c Release

      - name: Run Tests
        run: dotnet test FinancialAI.sln --no-build -c Release --verbosity normal

  python-build-and-test:
    name: Lint & Test Python AI Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry

      - name: Install dependencies
        run: poetry install --no-root

      - name: Lint with Ruff
        run: poetry run ruff check .

      - name: Typecheck with Mypy
        run: poetry run mypy app

      - name: Run Pytest
        run: poetry run pytest

  web-build:
    name: Build Web Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Next.js
        run: npm run build
