version: "3.8"

services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: financial-ai-cosmos
    environment:
      - AZURE_COSMOS_EMULATOR_PARTITION_COUNT=5
      - AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE=false
    ports:
      - "8081:8081"
      - "10251-10254:10251-10254"
    healthcheck:
      test: ["CMD", "curl", "-k", "https://localhost:8081/_explorer/emulator.pem"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - financial-net

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    container_name: financial-ai-servicebus
    environment:
      - ACCEPT_EULA=Y
      - SQL_SERVER=sqledge
      - MSSQL_SA_PASSWORD=YourStrong@Passw0rd
    ports:
      - "5672:5672"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5672 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial-net

  ai-service:
    build:
      context: ./services/ai
      dockerfile: Dockerfile
    container_name: financial-ai-python-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PORT=8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - financial-net

  api:
    build:
      context: .
      dockerfile: src/FinancialAI.Api/Dockerfile
    container_name: financial-ai-dotnet-api
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - AIService__BaseUrl=http://ai-service:8000
      - Azure__CosmosEndpoint=https://cosmos-emulator:8081
      - Azure__ServiceBusConnectionString=Endpoint=sb://servicebus-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=emulatorKey
    depends_on:
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - financial-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: financial-ai-web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - financial-net

networks:
  financial-net:
    driver: bridge
